# Dependabot opens a pull request when an action the workflows use has a new
# version. It is the only dependency GitHub can follow for us: nothing on
# GitHub reads build.zig.zon, so raylib, raylib-zig and Zig are followed by
# hand (docs/study/security.md).
#
# Commit titles follow ours: "ci: bump actions/checkout from 7 to 8".

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - "1.type: Chore"
      - "2.component: Setup"
